name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Run tests
        run: lua tests/test.lua .
